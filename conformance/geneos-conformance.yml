domain_standard:
  declared_in_contract: false
  note: >-
    REWARD-ONLY check, honestly scored as absent. Geneos's market is IT
    monitoring and observability, and the contract Geneos publishes declares no
    domain standard for it — the Netprobe REST API is a bespoke dataview
    publishing shape with no OpenTelemetry, OpenMetrics or Prometheus exposition
    semantics in it. That is a real finding: Geneos ingests those standards
    rather than speaking them outward.
  adjacent_standards_consumed:
    - standard: OpenTelemetry
      role: consumed
      evidence: https://docs.itrsgroup.com/docs/geneos/collection/opentelemetry/current/user-guide/opentelemetry/index.html
    - standard: Prometheus exposition / Alertmanager
      role: consumed
      evidence: https://docs.itrsgroup.com/docs/geneos/collection/prometheus/current/user-guide/prometheus/index.html
    - standard: StatsD
      role: consumed
      evidence: https://docs.itrsgroup.com/docs/geneos/collection/statsd/current/user-guide/statsd-java/index.html
    - standard: SNMP (MIBMON, Trapmon)
      role: consumed
      evidence: https://docs.itrsgroup.com/docs/geneos/current/index.html
    - standard: FIX Protocol
      role: consumed
      evidence: >-
        FIX Analyser 2 and the Message Tracker FIX adapter parse FIX sessions for
        monitoring. https://www.itrsgroup.com/technologies/fix-monitoring
    - standard: Nagios plugin protocol
      role: consumed
      evidence: https://github.com/ITRS-Group/geneos-xtender
  note_on_role: >-
    Each entry above is a collection plug-in — Geneos reads these formats off the
    monitored estate. None of them is declared by a Geneos contract as its own
    interface shape, so none of them satisfies domain_standard_conformance. They
    are recorded here so the distinction stays explicit rather than being
    mistaken for a conformance claim in a later pass.
