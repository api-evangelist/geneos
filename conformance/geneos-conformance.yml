conformance:
  - id: openapi-3.0
    conforms: true
    evidence: >-
      openapi/_original/geneos-netprobe-rest-api.yaml declares `openapi: 3.0.0`
      and parses. Published by ITRS at
      https://docs.itrsgroup.com/docs/geneos/api-sources/v1/rest-api.yaml
  - id: xml-rpc
    conforms: true
    evidence: >-
      "Geneos API clients communicate with the API plug-ins using the industry
      standard, well defined XML-RPC protocol over TCP/IP… The API plug-in acts as
      an XML-RPC server." ITRS cites the XML-RPC specification directly
      (http://xmlrpc.scripting.com/spec.html) and notes the specification's method
      name character restrictions apply.
      https://docs.itrsgroup.com/docs/geneos/current/collection/xml-rpc-api/index.html
  - id: sse
    conforms: true
    evidence: >-
      The Gateway REST command service emits command output as W3C Server-Sent
      Events when the client sends `Accept: text/event-stream`.
      https://docs.itrsgroup.com/docs/geneos/current/processing/monitoring-and-alerts/geneos_commands_tr/index.html#command-output-stream
    deviations:
      - >-
        No event ids and no event types are sent, and the Gateway does not support
        reconnecting to a stream — a reconnect reruns the command. SSE's
        Last-Event-ID resumption is therefore unavailable.
  - id: http-basic-auth
    conforms: true
    evidence: >-
      Gateway REST accepts HTTP basic access authentication.
      https://docs.itrsgroup.com/docs/geneos/current/processing/monitoring-and-alerts/geneos_commands_tr/index.html#user-authentication
  - id: bearer-token
    conforms: true
    evidence: >-
      SSO access tokens are supplied as `Authorization: Bearer <token>` and
      obtained from /rest/authorize.
  - id: mutual-tls
    conforms: true
    evidence: >-
      The Netprobe REST API plug-in can require and verify client certificates
      against a configured CA path.
      https://docs.itrsgroup.com/docs/geneos/current/collection/rest-api/index.html#plugin-configuration
  - id: iso-27001
    conforms: true
    evidence: >-
      ITRS Group states its security programme aligns with ISO/IEC 27001 and
      publishes a certificate at
      https://www.uptrends.com/downloads/ITRS-Group-Certificate.pdf — linked from
      https://www.itrsgroup.com/about/security-center
    scope: ITRS Group corporate, not a Geneos-specific attestation.
  - id: rfc9457
    conforms: false
    evidence: >-
      No surface returns application/problem+json. Gateway REST returns
