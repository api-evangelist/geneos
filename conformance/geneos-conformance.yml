  - id: oauth2
    conforms: false
    evidence: >-
      No OAuth 2.0 authorization server, no scopes, no grant flow. SSO tokens are
      issued by an ITRS SSO Agent or Gateway Hub, not by an OAuth 2.0 endpoint
