      status: 0
      note: DNS does not resolve.
  note: >-
    No status page exists and none is expected to — Geneos runs inside the
    customer's own estate, so there is no shared service whose availability ITRS
    could report. No `StatusPage` pointer is wired in apis.yml.
sla:
  published: false
  support_model: >-
    ITRS publishes a four-level severity classification (Severity 1 production
    failure through Severity 4 general enquiry) and a Level 1 → Level 2 support
    escalation model on its support centre page, plus 24x7 toll-free phone lines
    for the UK and US. Weekend and public-holiday telephone support is limited to
    Premium Service subscribers. No response-time commitments are published
    publicly; they sit in the commercial contract.
  source: https://www.itrsgroup.com/support-center
