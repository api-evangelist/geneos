versioning:
  scheme: semver-like MAJOR.MINOR.PATCH on the product, not on the APIs
  current: 7.11.2
  current_released: '2026-09-10'
  cadence: >-
    "New versions are released every two months." Patch releases land between
    minors — 7.11.0 (30 July 2026), 7.11.1 (5 August 2026), 7.11.2 (10 September 2026).
  docs_versioning: >-
    The documentation site is versioned per release, with /current/ redirecting
    to the newest (7.11.0 at the time of this probe). Older release trees stay
    online — the Netprobe REST API's ReDoc page is still served from the 5.14.0
    tree even though the OpenAPI it loads is the live one at
    /docs/geneos/api-sources/v1/rest-api.yaml.
  api_versioning: >-
    The Netprobe REST API paths are versioned independently and are on v1. The
    Gateway REST command service and the XML-RPC API carry no version in the
    path; their surface changes with the product release.
