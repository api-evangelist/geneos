breaking_changes:
  - version: Active Console 7.9.0
    change: Idle SSO users are now automatically logged out.
  - version: Gateway 7.7.0 / Netprobe 7.7.0
    change: >-
      A default row limit of 200 rows is enforced for plugins that previously had
      no configured limit. This silently truncates dataviews that used to grow
      unbounded, and it is the same limit that surfaces as LIMIT_REACHED on the
      XML-RPC API.
