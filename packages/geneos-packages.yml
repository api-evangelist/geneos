note: >-
  Geneos is customer-deployed software, so there is no hosted-API client SDK in
  the usual sense. What ITRS Group does publish, first-party and under its own
  GitHub organisation, is tooling and language bindings for the Geneos
  programmable surfaces: Go packages that speak the XML-RPC Instrumentation API
  and the Gateway REST command service, and a Rust library for building Toolkit
  samplers. Registry metadata below was read from the registries' own
  unauthenticated metadata endpoints on 2026-09-12. Searched and found NOTHING
  on npm (registry.npmjs.org search for "geneos" returned no first-party
  package), PyPI (geneos, py-geneos, geneos-toolkit, itrs-geneos all 404),
  Maven Central, NuGet, Packagist and RubyGems.
