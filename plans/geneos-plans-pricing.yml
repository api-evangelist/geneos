note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that invented Free / Professional /
  Enterprise tiers with 1,000 and 100,000 request quotas and a 10 rpm free rate
  limit. None of that was ever published by ITRS Group and none of it was true.
  The honest finding: Geneos publishes no pricing at all.
