  - url: https://www.itrsgroup.com/request-a-demo
    status: 200
plans: []
licensing:
  model: licensed on-premises software, enforced by a Licence Daemon
  mechanism: >-
    Geneos components validate against a Licence Daemon (licd), which checks the
    Gateway schema and tokens. Gateway licensing is documented at
    https://docs.itrsgroup.com/docs/geneos/current/administration/gateway_licensing/index.html
  separately_licensable:
    - name: XML-RPC Instrumentation API
      quote: >-
        "The API functionality is separately licensable. Please contact ITRS Sales
        for details."
      source: https://docs.itrsgroup.com/docs/geneos/current/collection/xml-rpc-api/index.html
    - name: Netprobe REST API plug-in
      requirement: >-
        Requires the GA4.12.x Netprobe, and the Gateway must connect to the
        GA4.12.x Licence Daemon to validate the schema and tokens.
      source: https://docs.itrsgroup.com/docs/geneos/current/collection/rest-api/index.html
  note: >-
    This is the commercially significant finding and it is invisible from a
    pricing page, because there is none: the programmable surfaces are not
    included by default. A buyer cannot enable the XML-RPC API without a separate
    licence conversation, and cannot enable the REST plug-in without being on a
    sufficiently recent Netprobe and Licence Daemon.
marketplace:
  - name: AWS Marketplace
    scope: Geneos AWS plug-in only, not the platform
    url: https://docs.itrsgroup.com/docs/geneos/collection/aws-cloudwatch/current/user-guide/aws-marketplace/index.html
