  - url: https://www.itrsgroup.com/pricing
    status: 404
  - url: https://www.itrsgroup.com/sitemap.xml
    status: 200
    finding: >-
      Enumerated every non-blog URL ITRS publishes. There is no /pricing, no
      /plans, no /products/pricing and no per-product pricing page. The
      commercial funnel is /request-a-demo, /products/free-trials,
      /request-a-callback and /about/contact.
