aid: geneos
name: Geneos
description: >-
  Geneos is ITRS Group's real-time monitoring and observability platform for
  trading systems, applications and infrastructure, deployed across investment
  banks, hedge funds, exchanges, telcos and government. It is customer-deployed
  software rather than a hosted API: Netprobes collect high-frequency telemetry
  at the edge, Gateways aggregate and rule over it, and each tier exposes its own
  programmable surface. The Netprobe ships a published OpenAPI 3.0 REST plug-in
  for pushing dataviews and streams into monitoring, an XML-RPC Instrumentation
  API for in-house applications to publish custom dataviews, and the Gateway
  exposes a JSON/Server-Sent-Events REST command service for running commands,
  snoozing entities, snapshotting dataviews and validating setup. ITRS also
  publishes first-party Go tooling (cordial, including the geneos CLI) and a
  Rust toolkit library on GitHub.
